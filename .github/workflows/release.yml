name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Build provenance is best-effort: don't let a Sigstore/attestation
      # service outage block a release.
      - uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      # The release notes are this version's section of CHANGELOG.md, written by hand.
      # If there isn't one, fall back to notes generated from the commits.
      - run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "Grill $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
