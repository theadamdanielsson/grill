name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      # The tag, package.json, manifest.json and versions.json must name the same version.
      - run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const man = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const bad = [pkg !== tag && "package.json", man.version !== tag && "manifest.json", versions[tag] !== man.minAppVersion && "versions.json"].filter(Boolean);
            if (bad.length) { console.error(`Not at ${tag}: ${bad.join(", ")}`); process.exit(1); }
          '
      - run: npm test
      - run: npm run build
      # Build provenance is best-effort: don't let a Sigstore/attestation
      # service outage block a release.
      - uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      # The release notes are this version's section of CHANGELOG.md, written by hand.
      # If there isn't one, fall back to notes generated from the commits.
      - run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "Grill $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
